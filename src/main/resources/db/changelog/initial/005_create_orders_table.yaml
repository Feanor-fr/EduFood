databaseChangeLog:
  - changeSet:
      id: 005-create-orders-table
      author: Artanis
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: total_sum
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: date
                  constraints:
                    nullable: false
