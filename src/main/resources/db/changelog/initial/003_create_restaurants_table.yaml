databaseChangeLog:
  - changeSet:
      id: 003-create-restaurants-table
      author: Artanis
      changes:
        - createTable:
            tableName: restaurants
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(300)
                  constraints:
                    nullable: false
