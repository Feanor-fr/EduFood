databaseChangeLog:
  - changeSet:
      id: 004-create-dishes-table
      author: Artanis
      changes:
        - createTable:
            tableName: dishes
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: restaurant_id
                  type: integer
                  constraints:
                    nullable: false