databaseChangeLog:
  - changeSet:
      id: 006_add_fk_in_tables
      author: Artanis
      changes:
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: role_name
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_users_roles
            onUpdate: cascade
            onDelete: restrict

        - addForeignKeyConstraint:
            baseTableName: dishes
            baseColumnNames: restaurant_id
            referencedTableName: restaurants
            referencedColumnNames: id
            constraintName: fk_dishes_restaurants
            onUpdate: cascade
            onDelete: cascade

        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: customer
            referencedTableName: users
            referencedColumnNames: email
            constraintName: fk_customer_users
            onUpdate: cascade
            onDelete: cascade
